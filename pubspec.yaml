name: tencent_cloud_chat_demo
description: The sample app of Tencent Cloud Chat Flutter integration. Includes two different interface for variety width that runs on iOS/Android/macOS/Windows/Web/H5 platform. This app is mainly build with our Flutter Chat TUIKit, which can adaptively display and business logic according to the type of platform and screen width.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 3.0.1+18

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Tencent Cloud Chat dependencies:
  tencent_cloud_chat_uikit: ^5.0.1
  # 与 third_party/tencent_cloud_chat_sdk（8.9.7545）对齐；9.0 需要 TXIMSDK >= 9.0
  tencent_cloud_chat_push: 8.9.7538
  tencent_chat_i18n_tool: ^2.3.8
  tencent_cloud_chat_sdk: ^8.7.7201
  # LiveKit 自建音视频（替换 TUICallKit/TRTC）
  livekit_client: ^2.8.1


  # Third party dependencies:
  cupertino_icons: ^1.0.2
  webview_flutter: ^4.4.2
  # 4.13+ 需要 Dart ^3.12（Flutter 3.44+）；当前本机 3.41.9 / Dart 3.11.5 用 4.12.x
  webview_flutter_android: ^4.12.0
  flutter_easyloading: ^3.0.3
  flutter_markdown: 0.6.23
  desktop_webview_window_for_is: ^0.2.4
  desktop_multi_window: 0.2.1
  bitsdojo_window: ^0.1.5
  flutter_screenutil: ^5.9.0
  dio: 4.0.6
  dlibphonenumber: ^1.1.65
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^9.0.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.6
  path: ^1.9.0
  ffi: ^2.1.3
  path_drawing: ^1.0.1
  image_picker: ^0.8.9
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  file_picker: ^9.0.2
  image_gallery_saver_plus: ^4.0.1
  mobile_scanner: 5.2.3
  qr_flutter: ^4.1.0
  flutter_contacts: 1.1.9
  photo_manager: ^3.6.4
  wechat_assets_picker: ^9.3.3
  camerawesome:
    path: third_party/camerawesome
  permission_handler: ^11.4.0
  audio_session: ^0.1.25
  just_audio: ^0.9.46
  crypto: ^3.0.3
  pointycastle: 4.0.0
  web: ^1.1.1
  web_socket_channel: ^3.0.2
  shared_preferences: ^2.2.2
  sqflite: ^2.4.1
  lpinyin: ^2.0.3
  # Keep on 2.3.x: 2.4+ needs sqlite3 3.x (.close API). We pin sqlite3 2.9.4
  # below to avoid iOS 0xe8008014 from adhoc-signed sqlite3.framework.
  sqflite_common_ffi: 2.3.7+1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  lottie: ^3.1.2
  visibility_detector: ^0.4.0+2
  clipboard: ^3.0.14
  connectivity_plus: ^7.2.0
  vibration: ^3.2.0
  zxing2: ^0.2.4
  image: ^4.8.0
  flutter_zxing: ^1.1.2
  local_auth: 2.3.0
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  open_file: ^3.5.11
  provider: ^6.1.5+1
  media_kit: ^1.2.5
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  awesome_video_player:
    path: third_party/awesome_video_player
  timezone: 0.10.1
  intl: ^0.20.2
  scrollable_positioned_list_for_us:
    path: third_party/scrollable_positioned_list_for_us

dependency_overrides:
  geolocator_android: ^4.6.2
  # livekit_client 2.8+ needs device_info_plus ^12; UIKit/i18n pin older.
  device_info_plus: ^12.3.0
  file: ^7.0.1
  # Flutter 3.32.4 requires the use of intl: ^0.20.2 version, which is also available in Flutter 3.29.x version
  intl: ^0.20.2
  # sqflite_common_ffi 2.4+ pulls sqlite3 3.x (native-assets). That embeds an
  # adhoc-signed sqlite3.framework into the iOS app and device install fails with
  # 0xe8008014. Pin 2.x so iOS keeps using system sqlite via sqflite_darwin.
  # See: https://github.com/simolus3/sqlite3.dart/issues/336
  sqlite3: 2.9.4
  sqflite_common_ffi: 2.3.7+1
  path_provider_foundation: 2.4.1
  tencent_cloud_chat_uikit:
    path: third_party/tencent_cloud_chat_uikit
  # 本地修复 file_picker iOS 的通用 FileUtils 类名，避免与 OSAnalytics 冲突。
  file_picker:
    path: third_party/file_picker
  # 3.9.0 本地补丁：fetchThumb 在 fastFormat 下接受降质图、不允许等 iCloud，
  # 避免 PHImageResultIsDegradedKey 把方法通道永久挂起。
  photo_manager:
    path: third_party/photo_manager
  azlistview_all_platforms:
    path: third_party/azlistview_all_platforms
  scrollable_positioned_list_for_us:
    path: third_party/scrollable_positioned_list_for_us
  tencent_cloud_chat_sdk:
    path: third_party/tencent_cloud_chat_sdk
  tim_ui_kit_sticker_plugin:
    path: third_party/tim_ui_kit_sticker_plugin
  flutter_plugin_record_plus:
    path: third_party/flutter_plugin_record_plus
  flutter_zxing:
    path: third_party/flutter_zxing
  # Flutter 3.44 removed ExtendSelectionByPageIntent; use 3.44-compat fork until pub release.
  extended_text_field:
    git:
      url: https://github.com/polbatllo/extended_text_field.git
      ref: flutter-3.44-compat

  # If you running this sample app on Flutter 3.24 or 3.27, please modify extended_text: ^14.0.0
  # extended_text: ^14.0.0

dev_dependencies:
  build_runner: any
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating localMsgspecific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  msix: ^3.14.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/
    - assets/lhc/
    - assets/profile_icons/
    - assets/wallet/
    - assets/chat_more/
    - assets/chat_backgrounds/
    - assets/img/
    - assets/images/
    - assets/life_payment/
    - assets/shenghuo/
    - assets/lottie/
    - assets/custom_face_resource/4350/
    - assets/custom_face_resource/4351/
    - assets/custom_face_resource/4352/
    - assets/user_guide/small/zh/
    - assets/user_guide/small/en/
    - assets/user_guide/
    - assets/live/
    - assets/ai/
    - assets/yin/
    - lib/country_list_pick-1.0.1+5/flags/
    - assets/calling_message/
    - assets/call_sounds/
    - assets/call_ui/
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: NotoSansSCVariable
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
flutter_intl:
  enabled: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/im_new_logo.jpg"

flutter_native_splash:
  background_image: "assets/splash_new.webp"
  android_gravity: fill
  fullscreen: true
  ios: true
  android: true
